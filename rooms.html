<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooms & Suites | Palm Horizon Resort & Spa</title>
  <link rel="stylesheet" href="css/rooms.css">
</head>
<body>

<nav class="site-nav">
  <a href="rooms.html" class="site-brand">✦ Palm Horizon</a>
  <div class="site-links">
    <a href="rooms.html" class="active">Rooms</a>
    <a href="booking.html">Book a Stay</a>
    <span id="authNav" class="auth-nav"></span>
  </div>
</nav>

<header>
  <h1>Palm Horizon Resort &amp; Spa</h1>
  <p>Choose Your Perfect Room</p>
</header>

<p class="notice" id="notice" hidden></p>

<section class="toolbar" aria-label="Filter rooms">
  <input type="search" id="searchInput" placeholder="Search rooms..." aria-label="Search rooms">
  <select id="categoryFilter" aria-label="Room category">
    <option value="All">All categories</option>
    <option value="Standard">Standard</option>
    <option value="Luxury">Luxury</option>
    <option value="Family">Family</option>
  </select>
  <select id="sortSelect" aria-label="Sort rooms">
    <option value="">Sort: Default</option>
    <option value="low">Price: Low to High</option>
    <option value="high">Price: High to Low</option>
  </select>
</section>

<section class="rooms" id="roomList">
  <!-- Room cards are rendered from js/data.js -->
</section>

<p class="empty-state" id="emptyState" hidden>No rooms match your search.</p>

<script type="module" src="js/rooms.js"></script>

</body>
</html>
