<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff — Hotel &amp; Resort Management</title>
  <meta name="description" content="Manage hotel staff — roles, shifts, departments and employment records." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content" id="main" role="main">

    <header class="page-header">
      <div class="page-title-block">
        <h1 class="font-serif">Staff</h1>
        <span class="title-underline"></span>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" id="btn-add-staff">
          <svg width="16" height="16"><use href="#icon-plus"/></svg> Add Staff
        </button>
      </div>
    </header>

    <!-- Filters -->
    <div class="card" style="padding:var(--s4) var(--s6)">
      <div class="filter-bar">
        <div class="input-wrap" style="flex:1;min-width:180px">
          <span class="input-icon"><svg width="16" height="16"><use href="#icon-search"/></svg></span>
          <input type="search" class="input" id="staff-search" placeholder="Search by name, role..." aria-label="Search staff" style="height:38px;font-size:.875rem">
        </div>
        <select class="select" id="filter-staff-role" aria-label="Filter by role" style="height:38px;font-size:.875rem;width:auto">
          <option value="">All Roles</option>
          <option>Manager</option>
          <option>Receptionist</option>
          <option>Housekeeping</option>
          <option>Chef</option>
          <option>Security</option>
          <option>Maintenance</option>
        </select>
        <select class="select" id="filter-staff-shift" aria-label="Filter by shift" style="height:38px;font-size:.875rem;width:auto">
          <option value="">All Shifts</option>
          <option>Morning</option>
          <option>Evening</option>
          <option>Night</option>
        </select>
        <select class="select" id="filter-staff-status" aria-label="Filter by status" style="height:38px;font-size:.875rem;width:auto">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="on-leave">On Leave</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="card" style="overflow:hidden">
      <div class="table-wrap" style="border:none;box-shadow:none">
        <table class="table" id="staff-table" role="grid">
          <thead>
            <tr>
              <th>Staff Member</th>
              <th class="sortable" data-sort="role">Role <span class="sort-icon">↕</span></th>
              <th>Department</th>
              <th>Phone</th>
              <th class="sortable" data-sort="shift">Shift <span class="sort-icon">↕</span></th>
              <th class="sortable" data-sort="joiningDate">Joining Date <span class="sort-icon">↕</span></th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="staff-body"></tbody>
        </table>
      </div>
    </div>

    <div class="flex items-center justify-between gap-4">
      <span id="staff-count" class="text-sm text-muted"></span>
      <div class="pagination" id="staff-pagination"></div>
    </div>

  </main>
</div>

<!-- Add / Edit Staff Modal -->
<div class="modal-backdrop" id="staff-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="staff-modal-title">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="font-serif" id="staff-modal-title">Add Staff Member</h3>
      <button class="modal-close" id="staff-modal-close" aria-label="Close"><svg width="18" height="18"><use href="#icon-x"/></svg></button>
    </div>
    <div class="modal-body">
      <form id="staff-form" novalidate>
        <div class="form-grid">
          <div class="field full">
            <label for="sf-name">Full Name <span class="req">*</span></label>
            <input type="text" class="input" id="sf-name" name="name" placeholder="Rahul Desai">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="sf-role">Role <span class="req">*</span></label>
            <select class="select" id="sf-role" name="role">
              <option value="">Select role</option>
              <option>Manager</option>
              <option>Receptionist</option>
              <option>Housekeeping</option>
              <option>Chef</option>
              <option>Security</option>
              <option>Maintenance</option>
            </select>
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="sf-department">Department</label>
            <input type="text" class="input" id="sf-department" name="department" placeholder="Front Desk">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="sf-phone">Phone <span class="req">*</span></label>
            <input type="tel" class="input" id="sf-phone" name="phone" placeholder="10-digit mobile">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="sf-email">Email <span class="req">*</span></label>
            <input type="email" class="input" id="sf-email" name="email" placeholder="rahul@resort.com">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="sf-shift">Shift</label>
            <select class="select" id="sf-shift" name="shift">
              <option>Morning</option>
              <option>Evening</option>
              <option>Night</option>
            </select>
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="sf-joining">Joining Date</label>
            <input type="date" class="input" id="sf-joining" name="joiningDate">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="sf-status">Status</label>
            <select class="select" id="sf-status" name="status">
              <option value="active">Active</option>
              <option value="on-leave">On Leave</option>
            </select>
            <span class="error-msg"></span>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="staff-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="staff-modal-save">Save</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/staff.js"></script>
</body>
</html>
