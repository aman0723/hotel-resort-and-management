<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooms — Hotel &amp; Resort Management</title>
  <meta name="description" content="Manage hotel rooms — add, edit, filter and update room status." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content" id="main" role="main">

    <!-- Page Header -->
    <header class="page-header">
      <div class="page-title-block">
        <h1 class="font-serif">Rooms</h1>
        <span class="title-underline"></span>
      </div>
      <div class="page-actions">
        <div class="view-toggle" role="group" aria-label="View mode">
          <button id="btn-grid-view" class="active" aria-label="Grid view" aria-pressed="true">
            <svg width="16" height="16"><use href="#icon-grid"/></svg>
          </button>
          <button id="btn-list-view" aria-label="List view" aria-pressed="false">
            <svg width="16" height="16"><use href="#icon-list"/></svg>
          </button>
        </div>
        <button class="btn btn-primary" id="btn-add-room">
          <svg width="16" height="16"><use href="#icon-plus"/></svg> Add Room
        </button>
      </div>
    </header>

    <!-- Filters -->
    <div class="card" style="padding:var(--s4) var(--s6)">
      <div class="filter-bar">
        <div class="input-wrap" style="flex:1;min-width:180px">
          <span class="input-icon"><svg width="16" height="16"><use href="#icon-search"/></svg></span>
          <input type="search" class="input" id="room-search" placeholder="Search by room number..." aria-label="Search rooms" style="height:38px;font-size:.875rem">
        </div>
        <select class="select" id="filter-type" aria-label="Filter by type" style="height:38px;font-size:.875rem;width:auto">
          <option value="">All Types</option>
          <option>Standard</option>
          <option>Deluxe</option>
          <option>Ocean Suite</option>
          <option>Garden Suite</option>
          <option>Villa</option>
        </select>
        <select class="select" id="filter-status" aria-label="Filter by status" style="height:38px;font-size:.875rem;width:auto">
          <option value="">All Statuses</option>
          <option value="available">Available</option>
          <option value="occupied">Occupied</option>
          <option value="cleaning">Cleaning</option>
          <option value="maintenance">Maintenance</option>
        </select>
        <select class="select" id="filter-price" aria-label="Filter by price range" style="height:38px;font-size:.875rem;width:auto">
          <option value="">Any Price</option>
          <option value="0-5000">Under ₹5,000</option>
          <option value="5000-10000">₹5,000–₹10,000</option>
          <option value="10000-20000">₹10,000–₹20,000</option>
          <option value="20000-999999">Above ₹20,000</option>
        </select>
      </div>
    </div>

    <!-- Results summary -->
    <div class="flex items-center justify-between gap-4" style="min-height:28px">
      <span id="rooms-count" class="text-sm text-muted"></span>
    </div>

    <!-- Room grid / list (injected by rooms.js) -->
    <div id="rooms-container"></div>

    <!-- Pagination -->
    <div class="flex justify-end">
      <div class="pagination" id="rooms-pagination"></div>
    </div>

  </main>
</div>

<!-- Add / Edit Room Modal -->
<div class="modal-backdrop" id="room-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="room-modal-title" hidden>
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="font-serif" id="room-modal-title">Add Room</h3>
      <button class="modal-close" id="room-modal-close" aria-label="Close dialog">
        <svg width="18" height="18"><use href="#icon-x"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="room-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="r-number">Room Number <span class="req" aria-hidden="true">*</span></label>
            <input type="text" class="input" id="r-number" name="number" placeholder="e.g. 101">
            <span class="error-msg" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="r-type">Type <span class="req" aria-hidden="true">*</span></label>
            <select class="select" id="r-type" name="type">
              <option value="">Select type</option>
              <option>Standard</option>
              <option>Deluxe</option>
              <option>Ocean Suite</option>
              <option>Garden Suite</option>
              <option>Villa</option>
            </select>
            <span class="error-msg" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="r-floor">Floor <span class="req" aria-hidden="true">*</span></label>
            <input type="number" class="input" id="r-floor" name="floor" min="1" max="10" placeholder="1">
            <span class="error-msg" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="r-price">Price per Night (₹) <span class="req" aria-hidden="true">*</span></label>
            <input type="number" class="input" id="r-price" name="pricePerNight" min="0" placeholder="4500">
            <span class="error-msg" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="r-capacity">Capacity (persons) <span class="req" aria-hidden="true">*</span></label>
            <input type="number" class="input" id="r-capacity" name="capacity" min="1" max="12" placeholder="2">
            <span class="error-msg" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="r-status">Status</label>
            <select class="select" id="r-status" name="status">
              <option value="available">Available</option>
              <option value="occupied">Occupied</option>
              <option value="cleaning">Cleaning</option>
              <option value="maintenance">Maintenance</option>
            </select>
            <span class="error-msg" aria-live="polite"></span>
          </div>
          <div class="field full">
            <label for="r-description">Description</label>
            <textarea class="textarea" id="r-description" name="description" rows="2" placeholder="Brief room description..."></textarea>
            <span class="error-msg" aria-live="polite"></span>
          </div>
          <div class="field full">
            <label>Amenities</label>
            <div class="check-group" id="amenities-group">
              <!-- Injected by rooms.js -->
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="room-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="room-modal-save">Save Room</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/rooms.js"></script>
</body>
</html>
