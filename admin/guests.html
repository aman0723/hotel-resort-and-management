<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guests — Hotel &amp; Resort Management</title>
  <meta name="description" content="Manage hotel guests — view profiles, booking history, and guest records." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content" id="main" role="main">

    <header class="page-header">
      <div class="page-title-block">
        <h1 class="font-serif">Guests</h1>
        <span class="title-underline"></span>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" id="btn-add-guest">
          <svg width="16" height="16"><use href="#icon-plus"/></svg> Add Guest
        </button>
      </div>
    </header>

    <!-- Filters -->
    <div class="card" style="padding:var(--s4) var(--s6)">
      <div class="filter-bar">
        <div class="input-wrap" style="flex:1;min-width:200px">
          <span class="input-icon"><svg width="16" height="16"><use href="#icon-search"/></svg></span>
          <input type="search" class="input" id="guest-search" placeholder="Search by name, email or phone..." aria-label="Search guests" style="height:38px;font-size:.875rem">
        </div>
        <select class="select" id="filter-id-type" aria-label="Filter by ID type" style="height:38px;font-size:.875rem;width:auto">
          <option value="">All ID Types</option>
          <option>Aadhar</option>
          <option>Passport</option>
          <option>PAN</option>
          <option>Voter ID</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="card" style="overflow:hidden">
      <div class="table-wrap" style="border:none;box-shadow:none">
        <table class="table" id="guests-table" role="grid">
          <thead>
            <tr>
              <th>Guest</th>
              <th class="sortable" data-sort="email">Email <span class="sort-icon">↕</span></th>
              <th>Phone</th>
              <th class="sortable" data-sort="city">City <span class="sort-icon">↕</span></th>
              <th>ID Proof</th>
              <th class="sortable" data-sort="totalStays">Stays <span class="sort-icon">↕</span></th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="guests-body"></tbody>
        </table>
      </div>
    </div>

    <div class="flex items-center justify-between gap-4">
      <span id="guests-count" class="text-sm text-muted"></span>
      <div class="pagination" id="guests-pagination"></div>
    </div>

  </main>
</div>

<!-- Add / Edit Guest Modal -->
<div class="modal-backdrop" id="guest-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="guest-modal-title">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="font-serif" id="guest-modal-title">Add Guest</h3>
      <button class="modal-close" id="guest-modal-close" aria-label="Close"><svg width="18" height="18"><use href="#icon-x"/></svg></button>
    </div>
    <div class="modal-body">
      <form id="guest-form" novalidate>
        <div class="form-grid">
          <div class="field full">
            <label for="g-name">Full Name <span class="req">*</span></label>
            <input type="text" class="input" id="g-name" name="name" placeholder="Arjun Mehta">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="g-email">Email <span class="req">*</span></label>
            <input type="email" class="input" id="g-email" name="email" placeholder="arjun@email.com">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="g-phone">Phone <span class="req">*</span></label>
            <input type="tel" class="input" id="g-phone" name="phone" placeholder="10-digit mobile">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="g-city">City</label>
            <input type="text" class="input" id="g-city" name="city" placeholder="Mumbai">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="g-id-type">ID Proof Type</label>
            <select class="select" id="g-id-type" name="idType">
              <option>Aadhar</option>
              <option>Passport</option>
              <option>PAN</option>
              <option>Voter ID</option>
            </select>
            <span class="error-msg"></span>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="guest-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="guest-modal-save">Save Guest</button>
    </div>
  </div>
</div>

<!-- View Profile Modal -->
<div class="modal-backdrop" id="profile-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="font-serif" id="profile-modal-title">Guest Profile</h3>
      <button class="modal-close" id="profile-modal-close" aria-label="Close"><svg width="18" height="18"><use href="#icon-x"/></svg></button>
    </div>
    <div class="modal-body" id="profile-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="profile-modal-close2">Close</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/guests.js"></script>
</body>
</html>
