<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments — Hotel &amp; Resort Management</title>
  <meta name="description" content="Manage hotel payments — revenue, invoices, UPI, card, cash records." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content" id="main" role="main">

    <header class="page-header">
      <div class="page-title-block">
        <h1 class="font-serif">Payments</h1>
        <span class="title-underline"></span>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" id="btn-record-payment">
          <svg width="16" height="16"><use href="#icon-plus"/></svg> Record Payment
        </button>
      </div>
    </header>

    <!-- Summary KPI cards -->
    <section aria-label="Payment summary">
      <div class="kpi-grid" id="payment-kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">
        <!-- Injected by payments.js -->
      </div>
    </section>

    <!-- Filters -->
    <div class="card" style="padding:var(--s4) var(--s6)">
      <div class="filter-bar">
        <div class="input-wrap" style="flex:1;min-width:180px">
          <span class="input-icon"><svg width="16" height="16"><use href="#icon-search"/></svg></span>
          <input type="search" class="input" id="pay-search" placeholder="Search by guest or payment ID..." aria-label="Search payments" style="height:38px;font-size:.875rem">
        </div>
        <select class="select" id="filter-pay-status" aria-label="Filter by status" style="height:38px;font-size:.875rem;width:auto">
          <option value="">All Statuses</option>
          <option value="paid">Paid</option>
          <option value="pending">Pending</option>
          <option value="refunded">Refunded</option>
          <option value="failed">Failed</option>
        </select>
        <select class="select" id="filter-pay-method" aria-label="Filter by method" style="height:38px;font-size:.875rem;width:auto">
          <option value="">All Methods</option>
          <option>UPI</option>
          <option>Card</option>
          <option>Cash</option>
          <option>Net Banking</option>
        </select>
        <input type="date" class="input" id="filter-pay-from" aria-label="From date" style="height:38px;font-size:.875rem;width:auto">
        <input type="date" class="input" id="filter-pay-to"   aria-label="To date"   style="height:38px;font-size:.875rem;width:auto">
      </div>
    </div>

    <!-- Table -->
    <div class="card" style="overflow:hidden">
      <div class="table-wrap" style="border:none;box-shadow:none">
        <table class="table" id="pay-table" role="grid">
          <thead>
            <tr>
              <th>Payment ID</th>
              <th>Booking</th>
              <th>Guest</th>
              <th>Amount</th>
              <th>Method</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="pay-body"></tbody>
        </table>
      </div>
    </div>

    <div class="flex items-center justify-between gap-4">
      <span id="pay-count" class="text-sm text-muted"></span>
      <div class="pagination" id="pay-pagination"></div>
    </div>

  </main>
</div>

<!-- Record Payment Modal -->
<div class="modal-backdrop" id="pay-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="pay-modal-title">
  <div class="modal">
    <div class="modal-header">
      <h3 class="font-serif" id="pay-modal-title">Record Payment</h3>
      <button class="modal-close" id="pay-modal-close" aria-label="Close"><svg width="18" height="18"><use href="#icon-x"/></svg></button>
    </div>
    <div class="modal-body">
      <form id="pay-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="p-booking">Booking ID <span class="req">*</span></label>
            <select class="select" id="p-booking" name="bookingId"><option value="">Select booking...</option></select>
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="p-guest">Guest</label>
            <input type="text" class="input" id="p-guest" readonly placeholder="Auto-filled">
          </div>
          <div class="field">
            <label for="p-amount">Amount (₹) <span class="req">*</span></label>
            <input type="number" class="input" id="p-amount" name="amount" min="0" placeholder="25000">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="p-method">Payment Method <span class="req">*</span></label>
            <select class="select" id="p-method" name="method">
              <option value="">Select method</option>
              <option>UPI</option>
              <option>Card</option>
              <option>Cash</option>
              <option>Net Banking</option>
            </select>
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="p-date">Date <span class="req">*</span></label>
            <input type="date" class="input" id="p-date" name="date">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="p-status">Status</label>
            <select class="select" id="p-status" name="status">
              <option value="paid">Paid</option>
              <option value="pending">Pending</option>
            </select>
            <span class="error-msg"></span>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="pay-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="pay-modal-save">Save</button>
    </div>
  </div>
</div>

<!-- Invoice Modal -->
<div class="modal-backdrop" id="invoice-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="invoice-modal-title">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="font-serif" id="invoice-modal-title">Invoice</h3>
      <button class="modal-close" id="invoice-modal-close" aria-label="Close"><svg width="18" height="18"><use href="#icon-x"/></svg></button>
    </div>
    <div class="modal-body" id="invoice-modal-body">
      <div id="invoice-print-area"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="invoice-modal-cancel">Close</button>
      <button class="btn btn-primary" id="btn-print-invoice">
        <svg width="16" height="16"><use href="#icon-printer"/></svg> Print / Save PDF
      </button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/payments.js"></script>
</body>
</html>
