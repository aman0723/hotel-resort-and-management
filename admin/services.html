<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services — Hotel &amp; Resort Management</title>
  <meta name="description" content="Manage resort services — restaurant, spa, transport, events and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content" id="main" role="main">

    <header class="page-header">
      <div class="page-title-block">
        <h1 class="font-serif">Services</h1>
        <span class="title-underline"></span>
      </div>
      <div class="page-actions">
        <div class="view-toggle" role="group" aria-label="View mode">
          <button id="btn-svc-grid" class="active" aria-label="Grid view" aria-pressed="true"><svg width="16" height="16"><use href="#icon-grid"/></svg></button>
          <button id="btn-svc-list" aria-label="List view" aria-pressed="false"><svg width="16" height="16"><use href="#icon-list"/></svg></button>
        </div>
        <button class="btn btn-primary" id="btn-add-svc">
          <svg width="16" height="16"><use href="#icon-plus"/></svg> Add Service
        </button>
      </div>
    </header>

    <!-- Filters -->
    <div class="card" style="padding:var(--s4) var(--s6)">
      <div class="filter-bar">
        <div class="input-wrap" style="flex:1;min-width:180px">
          <span class="input-icon"><svg width="16" height="16"><use href="#icon-search"/></svg></span>
          <input type="search" class="input" id="svc-search" placeholder="Search services..." aria-label="Search services" style="height:38px;font-size:.875rem">
        </div>
        <select class="select" id="filter-svc-category" aria-label="Filter by category" style="height:38px;font-size:.875rem;width:auto">
          <option value="">All Categories</option>
          <option>Restaurant</option>
          <option>Spa &amp; Wellness</option>
          <option>Swimming Pool</option>
          <option>Laundry</option>
          <option>Room Service</option>
          <option>Transport</option>
          <option>Events</option>
        </select>
      </div>
    </div>

    <div id="svc-container"></div>

    <!-- Service Requests section -->
    <div class="card">
      <div class="card-header">
        <div>
          <h3 class="font-serif" style="font-size:1.05rem">Service Requests</h3>
          <span class="title-underline"></span>
        </div>
      </div>
      <div class="table-wrap" style="border:none;box-shadow:none">
        <table class="table">
          <thead>
            <tr>
              <th>Request ID</th>
              <th>Guest</th>
              <th>Room</th>
              <th>Service</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="sreq-body"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- Add/Edit Service Modal -->
<div class="modal-backdrop" id="svc-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="svc-modal-title">
  <div class="modal">
    <div class="modal-header">
      <h3 class="font-serif" id="svc-modal-title">Add Service</h3>
      <button class="modal-close" id="svc-modal-close" aria-label="Close"><svg width="18" height="18"><use href="#icon-x"/></svg></button>
    </div>
    <div class="modal-body">
      <form id="svc-form" novalidate>
        <div class="form-grid">
          <div class="field full">
            <label for="s-name">Service Name <span class="req">*</span></label>
            <input type="text" class="input" id="s-name" name="name" placeholder="Swedish Massage">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="s-category">Category <span class="req">*</span></label>
            <select class="select" id="s-category" name="category">
              <option value="">Select category</option>
              <option>Restaurant</option>
              <option>Spa &amp; Wellness</option>
              <option>Swimming Pool</option>
              <option>Laundry</option>
              <option>Room Service</option>
              <option>Transport</option>
              <option>Events</option>
            </select>
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="s-price">Price (₹) <span class="req">*</span></label>
            <input type="number" class="input" id="s-price" name="price" min="0" placeholder="1500">
            <span class="error-msg"></span>
          </div>
          <div class="field full">
            <label for="s-description">Description</label>
            <textarea class="textarea" id="s-description" name="description" rows="2" placeholder="Brief description..."></textarea>
            <span class="error-msg"></span>
          </div>
          <div class="field full">
            <label class="switch">
              <input type="checkbox" id="s-available" name="available" checked>
              <span class="switch-track"><span class="switch-thumb"></span></span>
              <span class="switch-label">Service Available</span>
            </label>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="svc-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="svc-modal-save">Save</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/services.js"></script>
</body>
</html>
