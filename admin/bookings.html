<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookings — Hotel &amp; Resort Management</title>
  <meta name="description" content="Manage hotel bookings — confirmed, pending, checked-in, checked-out." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content" id="main" role="main">

    <header class="page-header">
      <div class="page-title-block">
        <h1 class="font-serif">Bookings</h1>
        <span class="title-underline"></span>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" id="btn-add-booking">
          <svg width="16" height="16"><use href="#icon-plus"/></svg> New Booking
        </button>
      </div>
    </header>

    <!-- Status tabs -->
    <div class="card" style="padding:0">
      <div class="tabs" id="booking-tabs" role="tablist" aria-label="Booking status">
        <!-- Injected by bookings.js -->
      </div>
    </div>

    <!-- Filters -->
    <div class="card" style="padding:var(--s4) var(--s6)">
      <div class="filter-bar">
        <div class="input-wrap" style="flex:1;min-width:200px">
          <span class="input-icon"><svg width="16" height="16"><use href="#icon-search"/></svg></span>
          <input type="search" class="input" id="booking-search" placeholder="Search by guest or booking ID..." aria-label="Search bookings" style="height:38px;font-size:.875rem">
        </div>
        <input type="date" class="input" id="filter-date-from" aria-label="From date" style="height:38px;font-size:.875rem;width:auto">
        <input type="date" class="input" id="filter-date-to" aria-label="To date" style="height:38px;font-size:.875rem;width:auto">
      </div>
    </div>

    <!-- Table -->
    <div class="card" style="overflow:hidden">
      <div class="table-wrap" style="border:none;box-shadow:none">
        <table class="table" id="bookings-table" role="grid">
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Guest</th>
              <th>Room</th>
              <th>Check-in</th>
              <th>Check-out</th>
              <th>Nights</th>
              <th>Guests</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookings-body"></tbody>
        </table>
      </div>
    </div>

    <div class="flex items-center justify-between gap-4">
      <span id="bookings-count" class="text-sm text-muted"></span>
      <div class="pagination" id="bookings-pagination"></div>
    </div>

  </main>
</div>

<!-- New / Edit Booking Modal -->
<div class="modal-backdrop" id="booking-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="booking-modal-title">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="font-serif" id="booking-modal-title">New Booking</h3>
      <button class="modal-close" id="booking-modal-close" aria-label="Close"><svg width="18" height="18"><use href="#icon-x"/></svg></button>
    </div>
    <div class="modal-body">
      <form id="booking-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="b-guest">Guest <span class="req">*</span></label>
            <select class="select" id="b-guest" name="guestId"><option value="">Select guest...</option></select>
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="b-room">Room <span class="req">*</span></label>
            <select class="select" id="b-room" name="roomId"><option value="">Select room...</option></select>
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="b-checkin">Check-in Date <span class="req">*</span></label>
            <input type="date" class="input" id="b-checkin" name="checkIn">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="b-checkout">Check-out Date <span class="req">*</span></label>
            <input type="date" class="input" id="b-checkout" name="checkOut">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="b-guests">No. of Guests <span class="req">*</span></label>
            <input type="number" class="input" id="b-guests" name="guests" min="1" max="10" value="1">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="b-status">Status</label>
            <select class="select" id="b-status" name="status">
              <option value="confirmed">Confirmed</option>
              <option value="pending">Pending</option>
            </select>
            <span class="error-msg"></span>
          </div>
          <div class="field full">
            <label for="b-notes">Notes</label>
            <textarea class="textarea" id="b-notes" name="notes" rows="2" placeholder="Special requests..."></textarea>
          </div>
          <!-- Live total -->
          <div class="full" id="booking-price-summary" style="display:none;background:var(--primary-soft);border-radius:var(--r-lg);padding:var(--s4)">
            <div class="flex justify-between text-sm mb-1"><span>Room charges (<span id="bps-nights">0</span> nights × <span id="bps-rate">₹0</span>)</span><span id="bps-base">₹0</span></div>
            <div class="flex justify-between text-sm mb-1 text-muted"><span>GST (12%)</span><span id="bps-tax">₹0</span></div>
            <div class="flex justify-between font-semibold text-primary" style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px"><span>Total Amount</span><span id="bps-total">₹0</span></div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="booking-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="booking-modal-save">Save Booking</button>
    </div>
  </div>
</div>

<!-- View Booking Details Modal -->
<div class="modal-backdrop" id="booking-detail-backdrop" role="dialog" aria-modal="true" aria-labelledby="booking-detail-title">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="font-serif" id="booking-detail-title">Booking Details</h3>
      <button class="modal-close" id="booking-detail-close" aria-label="Close"><svg width="18" height="18"><use href="#icon-x"/></svg></button>
    </div>
    <div class="modal-body" id="booking-detail-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="booking-detail-close2">Close</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/bookings.js"></script>
</body>
</html>
