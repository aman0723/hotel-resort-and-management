<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Hotel &amp; Resort Management</title>
  <meta name="description" content="Admin dashboard for Hotel and Resort Management System — live KPIs, bookings, and revenue overview." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Sidebar and Topbar injected by layout.js -->
    <main class="main-content" id="main" role="main">

      <!-- Page header -->
      <header class="page-header" id="page-header">
        <div class="page-title-block">
          <h1 id="greeting-heading" class="font-serif">Good Morning, Admin 👋</h1>
          <span id="today-date" class="overline" style="margin-top:4px;display:block"></span>
          <span class="title-underline"></span>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary btn-sm" id="btn-reset-data">
            <svg width="14" height="14" aria-hidden="true"><use href="#icon-refresh"/></svg>
            Reset Demo Data
          </button>
        </div>
      </header>

      <!-- KPI cards -->
      <section aria-label="Key performance indicators">
        <div class="kpi-grid" id="kpi-grid">
          <!-- Injected by dashboard.js -->
          <div class="skeleton" style="height:130px;border-radius:14px"></div>
          <div class="skeleton" style="height:130px;border-radius:14px"></div>
          <div class="skeleton" style="height:130px;border-radius:14px"></div>
          <div class="skeleton" style="height:130px;border-radius:14px"></div>
          <div class="skeleton" style="height:130px;border-radius:14px"></div>
          <div class="skeleton" style="height:130px;border-radius:14px"></div>
        </div>
      </section>

      <!-- Charts row -->
      <div class="dash-grid">
        <!-- Revenue chart -->
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="font-serif" style="font-size:1.05rem">Revenue — Last 6 Months</h3>
              <span class="title-underline"></span>
            </div>
            <span id="revenue-total-label" class="badge badge-primary"></span>
          </div>
          <div class="card-body" style="padding-bottom:8px">
            <div id="revenue-chart" style="width:100%;overflow:hidden"></div>
          </div>
        </div>

        <!-- Donut + legend -->
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="font-serif" style="font-size:1.05rem">Room Occupancy by Type</h3>
              <span class="title-underline"></span>
            </div>
          </div>
          <div class="card-body flex flex-col items-center gap-6">
            <div id="donut-chart"></div>
            <div id="donut-legend" style="width:100%"></div>
          </div>
        </div>
      </div>

      <!-- Room status grid + Quick Actions -->
      <div class="dash-grid">
        <!-- Room status overview -->
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="font-serif" style="font-size:1.05rem">Room Status Overview</h3>
              <span class="title-underline"></span>
            </div>
            <div class="flex gap-2 flex-wrap" id="room-status-legend"></div>
          </div>
          <div class="card-body">
            <div class="room-grid-display" id="room-status-grid"></div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="card">
          <div class="card-header">
            <h3 class="font-serif" style="font-size:1.05rem">Quick Actions</h3>
          </div>
          <div class="card-body flex flex-col gap-3">
            <a href="rooms.html" class="btn btn-secondary w-full" style="justify-content:flex-start;gap:12px">
              <svg width="18" height="18"><use href="#icon-bed"/></svg> Add New Room
            </a>
            <a href="bookings.html" class="btn btn-primary w-full" style="justify-content:flex-start;gap:12px">
              <svg width="18" height="18"><use href="#icon-plus"/></svg> New Booking
            </a>
            <a href="guests.html" class="btn btn-secondary w-full" style="justify-content:flex-start;gap:12px">
              <svg width="18" height="18"><use href="#icon-users"/></svg> Add Guest
            </a>
            <a href="services.html" class="btn btn-secondary w-full" style="justify-content:flex-start;gap:12px">
              <svg width="18" height="18"><use href="#icon-concierge-bell"/></svg> Add Service
            </a>
            <a href="payments.html" class="btn btn-secondary w-full" style="justify-content:flex-start;gap:12px">
              <svg width="18" height="18"><use href="#icon-credit-card"/></svg> Record Payment
            </a>
            <a href="staff.html" class="btn btn-secondary w-full" style="justify-content:flex-start;gap:12px">
              <svg width="18" height="18"><use href="#icon-id-badge"/></svg> Add Staff
            </a>
          </div>
        </div>
      </div>

      <!-- Recent Bookings -->
      <div class="card">
        <div class="card-header">
          <div>
            <h3 class="font-serif" style="font-size:1.05rem">Recent Bookings</h3>
            <span class="title-underline"></span>
          </div>
          <a href="bookings.html" class="btn btn-ghost btn-sm">View All →</a>
        </div>
        <div class="table-wrap" style="border:none;box-shadow:none">
          <table class="table" id="recent-bookings-table">
            <thead>
              <tr>
                <th>Booking ID</th>
                <th>Guest</th>
                <th>Room</th>
                <th>Check-in</th>
                <th>Check-out</th>
                <th>Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recent-bookings-body">
              <!-- Injected by dashboard.js -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Scripts (in dependency order, classic <script> tags for file:// compat) -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
