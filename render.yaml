# Render Blueprint: deploys the site as a free Render Static Site.
# Render Dashboard -> New -> Blueprint -> pick this repository -> Apply.
# Every push to `main` redeploys automatically.
services:
  - type: web
    runtime: static
    name: palm-horizon-resort
    branch: main
    # The website lives in public/; everything else in the repo is setup
    # (README, rules, npm config) and is not published. No build step.
    buildCommand: echo "Static site, no build step"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
