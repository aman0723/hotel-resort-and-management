# Render Blueprint: deploys the site as a free Render Static Site.
# Render Dashboard -> New -> Blueprint -> pick this repository -> Apply.
# Every push to `main` redeploys automatically.
services:
  - type: web
    runtime: static
    name: palm-horizon-resort
    branch: main
    # Publish only the website files, not README, rules or npm config.
    buildCommand: rm -rf dist && mkdir -p dist && cp -r *.html css js images dist/
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
